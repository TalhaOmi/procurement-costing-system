name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ProcurementCosting.sln
      - name: Build
        run: dotnet build ProcurementCosting.sln --no-restore -c Release
      - name: Test
        run: dotnet test ProcurementCosting.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: CSV report tool runs on the sample file
        # Exit code 1 is expected: the sample deliberately contains bad rows.
        run: dotnet run --project tools/CsvReport -c Release --no-build -- tools/CsvReport/sample/invoices.csv || test $? -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/results.trx"

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t procurement-costing:ci .
      - name: Smoke test
        run: |
          docker run -d --name erp -p 8080:8080 procurement-costing:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/reports/budget-vs-actual && break
            sleep 2
          done
          curl -fs http://localhost:8080/reports/validation | grep -q DUPLICATE_INVOICE_NUMBER
          docker logs erp
